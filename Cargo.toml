[package]
name = "xpui"
description = "A declarative UI framework for e-ink firmware"
readme = "README.md"
keywords = ["ui", "embedded", "no-std", "eink", "gui"]
categories = ["embedded", "gui", "no-std"]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-framework"

# rlib only. This crate is consumed by a backend and an application, which
# together produce whatever the target actually links — a staticlib for a C++
# firmware, a binary for a host. Emitting a staticlib here as well produced a
# 17 MB archive that contributed zero objects to the final link.
[lib]
crate-type = ["rlib"]

[features]
# Exposes the deterministic test doubles in `testing` to downstream crates, so
# a backend or an application can unit-test layouts without a renderer.
testing = []

[dependencies]

# Its own workspace now: this crate is a repository, and the profile every
# `xpui*` repository shares lives in each of them rather than in one root
# nobody else can see.
[workspace]

# What a `cargo build --release` of this repository alone produces.
#
# It is **not** what ships. A library's profile applies only when that library
# is the top of the build; when a firmware links it, the firmware's workspace
# sets the profile for everything in the graph. So this exists to make a local
# release build resemble the real one, not to control it.
#
# The repositories that do produce a flashed artifact — `xpui-rp2040`,
# `xpui-esp32`, `xpui-cpp` — use `opt-level = "z"` and say why there.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
