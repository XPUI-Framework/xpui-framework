# This repository's gate, as a program rather than a thousand lines of
# shell.  It holds only what this repository checks. There is no C++ here,
# so there is no C++ stage. There is the genericity grep, which no other
# repository needs: this is the framework, and it may not name a product, a
# device or a backend.
#
# No dependencies, on purpose: a gate that fails because something it
# fetched moved is a gate that has to be argued with before it can be
# believed.
[package]
name = "xtask"
description = "The gate for xpui: format, lint, test, the prose, and the genericity rule"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-framework"
publish = false

[lints]
workspace = true

[dependencies]
